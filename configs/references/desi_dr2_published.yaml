schema_version: 1
aor_status: reference
notes: >
  These are full-likelihood published reference values for E1-A reproduction
  gates. Compressed-CMB runs are expected to land near, but not exactly on, the
  full-likelihood references because the compression omits the full CMB
  perturbation/lensing likelihood information.
sigma_convention: >
  Symmetric 68 percent half-widths are recorded directly. Where the DESI table
  reports asymmetric 68 percent intervals, the *_sigma value is the arithmetic
  mean of the plus and minus half-widths, with the asymmetric half-widths kept
  in *_sigma_plus and *_sigma_minus.
provenance:
  desi_dr2_bao_cosmology:
    arxiv: "2503.14738"
    title: "DESI DR2 Results II: Measurements of Baryon Acoustic Oscillations and Cosmological Constraints"
    url: "https://arxiv.org/abs/2503.14738"
    constraints_table: "Table \\ref{tab:cosmo_constraints}"
    significance_table: "Table \\ref{tab:dchisq}"
    significance_section: "Conclusion paragraph beginning 'The evidence for a departure from LCDM...'"
    cmb_definition: >
      DESI DR2 paper baseline CMB combines Planck TT/TE/EE low/high-ell
      likelihoods using Commander/simall/CamSpec plus Planck+ACT DR6 lensing;
      see Section \\ref{subsec:CMB}. This differs from the local E1 Planck
      native-likelihood path but is the published DR2 reference.
  planck_2018_cosmology:
    arxiv: "1807.06209"
    title: "Planck 2018 results. VI. Cosmological parameters"
    url: "https://arxiv.org/abs/1807.06209"
    table_or_section: "Abstract summary; Table \\ref{table:default}; Section \\ref{sec:lcdm}"
